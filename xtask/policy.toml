# Policy configuration for cargo xtask
# This file allows customization of enforcement rules for different repo structures
#
# Scope: rules scan Rust sources only (ripgrep `--type rust`, excluding target/).
# Markdown, docs/, and design notes are intentionally out of scope.

[allowlists]
# Paths where locks are allowed (relative to repo root)
lock_allowed = [
    "runtime/",
    "drivers/",
    "xtask/",
    "tests/",
]

# Paths where thread/task spawning is allowed
spawn_allowed = [
    "runtime/scheduler.rs",
    "runtime/main.rs",
    "xtask/",
    "tests/",
]

# Paths where SSOT state type references are allowed
# (e.g., MachineState, AppState, etc.)
ssot_allowed = [
    "state_owner.rs",
    "state.rs",
    "core/src/state.rs",
    "xtask/",
    "tests/",
]

# milton-spec #32 NO POLLERS (event-driven only): paths where Rust
# sleep/interval waits are allowed. Intentionally EMPTY — SDD 032 permits
# zero exceptions (docs/sdd/032-no-pollers-event-driven.sdd). Required key.
poller_allowed = []

[patterns]
# Patterns to detect locks (regex)
lock_patterns = [
    "std::sync::Mutex",
    "std::sync::RwLock",
    "tokio::sync::Mutex",
    "tokio::sync::RwLock",
    "parking_lot::Mutex",
    "parking_lot::RwLock",
    "\\.lock\\(\\)\\.await",
]

# Patterns to detect thread/task spawning
spawn_patterns = [
    "std::thread::spawn",
    "tokio::spawn",
    "tokio::task::spawn",
]

# milton-spec #32 NO POLLERS: Rust sleep/interval waits (mirrors milton
# scripts/check-no-pollers.py RUST_WAIT_RE, plus a `use` import trap so a
# bare `sleep(...)` after `use std::thread::sleep;` cannot slip through).
# The first pattern skips matches after a `//` line comment. Required key.
poller_patterns = [
    '^(?:[^/]|/[^/])*?\b(?:thread|time)::(?:sleep|sleep_until|interval|interval_at)\s*\(',
    '^\s*(?:pub\s+)?use\s+(?:std|tokio|async_std|futures_timer)::[^;]*\b(?:sleep|sleep_until|interval|interval_at)\b',
]

# SSOT state type names to check (will be matched as word boundaries)
ssot_types = [
    "MachineState",
    # Add other state types here if you have multiple
]

[options]
# Whether to fail if ripgrep is not found (false = warn but continue).
# true: a policy gate that cannot run must fail closed (SDD 032; RULES fail-loud).
require_ripgrep = true

