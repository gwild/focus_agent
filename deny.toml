# cargo deny configuration (cargo-deny >= 0.16 schema, version = 2)
# Bans unwanted dependencies and enforces license policy.

[graph]
all-features = true

[advisories]
version = 2
# Vulnerability and unsound advisories are always errors in v2.
# Unmaintained: error for any crate in the graph.
unmaintained = "all"
yanked = "deny"
# Ignore specific advisories if needed, with a reason:
# ignore = [{ id = "RUSTSEC-YYYY-XXXX", reason = "..." }]
ignore = []

[licenses]
version = 2
# Permissive licenses only. Anything not listed (incl. GPL/AGPL/LGPL) is denied.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unlicense",
    "Zlib",
    # unicode-ident (via proc-macro2/syn): permissive, OSI-approved
    "Unicode-3.0",
]
confidence-threshold = 0.8
# Keep the allowlist ahead of the dep graph without noisy warnings.
unused-allowed-license = "allow"

[bans]
# Allow multiple versions of same crate (useful during transitions)
multiple-versions = "allow"
# Ban specific crates if needed, e.g.:
# deny = [{ name = "parking_lot", reason = "Use tokio::sync::Mutex instead" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
